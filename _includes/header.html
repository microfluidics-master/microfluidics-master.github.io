<div class="topbar">
  <div class="wrapper">
    <span class="topbar-left">★ Université PSL · Sorbonne Université · Université Paris Cité · Université Paris-Saclay</span>
    <span class="topbar-right">
      <span class="lang-switch" aria-label="Language"><a href="{{ '/francais/' | relative_url }}"{% if page.url == '/francais/' %} class="on"{% endif %}>FR</a> | <a href="{{ '/english/' | relative_url }}"{% if page.url == '/english/' %} class="on"{% endif %}>EN</a></span>
      <a href="{{ '/calendar/' | relative_url }}">🔒 Student area</a>
      <a href="https://www.institut-pgg.fr/">IPGG ↗</a>

  </div>
</div>
<header class="site-header">
  <div class="wrapper">
    <a class="site-brand" rel="author" href="{{ '/' | relative_url }}">
      <img src="{{ site.logo | relative_url }}" alt="Institut Pierre-Gilles de Gennes" class="brand-logo">
      <span class="brand-text">
        <span class="brand-kicker">Master 2</span>
        <span class="brand-title">Microfluidics &amp; Miniaturization</span>
      </span>
    </a>
    <nav class="site-nav">
      <input type="checkbox" id="nav-trigger" />
      <label for="nav-trigger"><svg class="menu-svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span class="visually-hidden">Menu</span></label>
      <div class="nav-items">
        <a class="nav-item{% if page.url == '/english/' or page.url == '/francais/' %} active{% endif %}" href="{{ '/english/' | relative_url }}">The Master</a>
        <a class="nav-item{% if page.url == '/microfluidics/' %} active{% endif %}" href="{{ '/microfluidics/' | relative_url }}">Microfluidics</a>
        <a class="nav-item{% if page.url == '/alumni/' %} active{% endif %}" href="{{ '/alumni/' | relative_url }}">Alumni</a>
        <a class="nav-item{% if page.url == '/resources/' %} active{% endif %}" href="{{ '/resources/' | relative_url }}">Resources</a>
        <a class="nav-item nav-cta" href="{{ '/apply/' | relative_url }}">Apply</a>
      </div>
    </nav>
  </div>
</header>
